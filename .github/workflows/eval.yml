name: Eval regression check

# Item 12b : garde-fou de qualité, pas le gate rapide (voir ci.yml) - fait un
# vrai run Bedrock+Supabase (~0,10-0,20 $), donc ne se déclenche plus
# automatiquement sur chaque push. Deux façons de le lancer :
#   1. Label `run-eval` posé sur la PR (reste actif : chaque nouveau push sur
#      une PR déjà labellisée relance le check et redépense - retirer le
#      label pour itérer sans coût, le reposer avant de merger).
#   2. Déclenchement manuel ("Run workflow" dans l'onglet Actions), utile
#      pour vérifier `main` après un merge.
# Le filtre de chemins reste appliqué même avec le label, pour ne pas payer
# un run sur un changement web/docs sans rapport.
#
# Règle pour tout agent IA codeur sur ce dépôt : ne jamais poser le label
# `run-eval` soi-même. Demander explicitement au développeur d'abord, en
# rappelant le coût par run et le fait que le label reste actif sur les push
# suivants tant qu'il n'est pas retiré - voir AGENTS.md.
#
# Secrets requis dans les paramètres GitHub Actions du dépôt (mêmes noms que
# .env.example) avant que ce check puisse passer en réel :
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#   MODEL_VOLUME, MODEL_ESCALADE, MODEL_EMBEDDING,
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
# Non provisionnables depuis ce dépôt - action manuelle, même catégorie que
# le plafond de facturation AWS documenté dans project-overview.md.

concurrency:
  group: eval-regression-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/agent/**'
      - 'packages/retrieval/**'
      - 'packages/eval/**'
      - 'packages/shared/**'
      - 'eval/questions.json'
      - 'eval/baseline.json'
      - '.github/workflows/eval.yml'
  workflow_dispatch: {}

jobs:
  eval-regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @legirag/eval regression-check:ci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          MODEL_VOLUME: ${{ secrets.MODEL_VOLUME }}
          MODEL_ESCALADE: ${{ secrets.MODEL_ESCALADE }}
          MODEL_EMBEDDING: ${{ secrets.MODEL_EMBEDDING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
